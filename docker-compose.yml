services:
  # ----------------------------------------------------------------------------
  # Servicio 1: Frontend WebApp (Next.js 14, salida standalone)
  # Es autónomo: se alimenta de realData.json y de sus propias rutas API
  # (chat, report, alerts). No consume la ML API, por eso no depende de ella.
  # ----------------------------------------------------------------------------
  webapp:
    build:
      context: ./apps/webapp
      dockerfile: Dockerfile
    container_name: cenepred-webapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - cenepred-network

  # ----------------------------------------------------------------------------
  # Servicio 2: API de Inferencia ML (FastAPI + XGBoost + SHAP)
  # Endpoint de serving independiente del modelo real (mismo contrato que Azure ML).
  # Su build entrena y hornea los artefactos desde la capa Gold local.
  # ----------------------------------------------------------------------------
  ml-api:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: cenepred-ml-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cenepred-network

networks:
  cenepred-network:
    driver: bridge

version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # Servicio 1: Frontend WebApp (Next.js 14)
  # ----------------------------------------------------------------------------
  webapp:
    build:
      context: ./apps/webapp
      dockerfile: Dockerfile
    container_name: cenepred-webapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_ML_API_URL=http://localhost:8000
    depends_on:
      ml-api:
        condition: service_healthy
    networks:
      - cenepred-network

  # ----------------------------------------------------------------------------
  # Servicio 2: API de Inferencia ML (FastAPI + XGBoost + SHAP)
  # ----------------------------------------------------------------------------
  ml-api:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: cenepred-ml-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cenepred-network

networks:
  cenepred-network:
    driver: bridge

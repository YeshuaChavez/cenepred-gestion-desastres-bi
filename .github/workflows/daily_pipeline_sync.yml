name: Sincronización Diaria WebApp (Gold ADLS -> realData.json)

on:
  # Programación diaria DESACTIVADA temporalmente: la suscripción de Azure está pausada, por lo
  # que ADLS no es accesible y la sincronización fallaría cada día (generando correos de error).
  # Reactivar descomentando el cron cuando Azure vuelva a estar disponible. Se mantiene la
  # ejecución manual (workflow_dispatch).
  # schedule:
  #   # 07:45 UTC (02:45 Perú), después del pipeline diario de Databricks (07:00 UTC) que deja el
  #   # Gold fresco en ADLS. Regenera realData.json y hace commit -> Vercel redespliega el webapp.
  #   - cron: '45 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-webapp-data:
    name: Regenerar realData.json desde el Gold de ADLS
    runs-on: ubuntu-latest
    env:
      AZURE_STORAGE_ACCOUNT: stcenepreddev1
      ADLS_GOLD_CONTAINER: gold
      AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (ligeras, solo export)
        run: pip install --quiet pandas numpy pyarrow azure-storage-blob

      - name: Descargar Gold fresco desde ADLS
        run: python scripts/download_gold_from_adls.py

      - name: Regenerar realData.json del webapp
        run: python scripts/export_gold_to_webapp_json.py

      - name: Commit y push si cambió (Vercel redespliega solo)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add apps/webapp/src/data/realData.json
          if git diff --staged --quiet; then
            echo "Sin cambios en realData.json; no se requiere commit."
          else
            git commit -m "chore(data): auto-sync realData.json desde el Gold de ADLS [skip ci]"
            git push origin main
          fi

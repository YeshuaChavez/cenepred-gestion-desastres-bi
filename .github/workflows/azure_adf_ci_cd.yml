name: Azure Data Factory & ETL Pipeline CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: 🧪 Run Unit Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: 🔍 Linting with Ruff
        run: |
          python -m ruff check . --select F,E9

      - name: 🧪 Execute Unit Tests (pytest)
        run: |
          python -m pytest tests/ -v

      - name: ⚡ Validate Master Pipeline Syntax
        run: |
          python data/pipelines/master_pipeline.py --help || python -c "import data.pipelines.master_pipeline"

  check-secrets:
    name: 🔎 Check Deploy Credentials
    needs: validate-and-test
    runs-on: ubuntu-latest
    outputs:
      has-azure: ${{ steps.check.outputs.has-azure }}
    steps:
      # El contexto `secrets` no está disponible en el `if` a nivel de job, pero sí
      # dentro de un step. Se expone como output para gatear el job de deploy.
      - id: check
        run: echo "has-azure=${{ secrets.AZURE_CREDENTIALS != '' }}" >> "$GITHUB_OUTPUT"

  deploy-adf:
    name: ☁️ Deploy Azure Data Factory Pipeline
    needs: [validate-and-test, check-secrets]
    if: github.ref == 'refs/heads/main' && needs.check-secrets.outputs.has-azure == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🚀 Validate & Deploy ADF Pipeline ARM Template
        uses: azure/arm-deploy@v1
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: 'rg-cenepred-dev'
          template: './infra/azure_data_factory/adf_pipeline_etl_cenepred.json'
          deploymentMode: 'Incremental'
